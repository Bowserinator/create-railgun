modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
issueTrackerURL="https://github.com/Bowserinator/create-railgun/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory

logoFile="assets/createrailgun/textures/misc/mod_logo.png"

authors="Bowserinator"
description='''
Adds the railgun from Project Wingman to create
'''

